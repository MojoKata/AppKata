# AppKata's CI (docs/github-workflows.md). Every PR and push to master: tier 1 in parts, its
# coverage and times, the Linux tour, the Pages site, and both builds, whose files (unsigned, each with
# its .sha256) are kept with the run. A push to master publishes the site, with its tour. A v* tag: the same, built without the caches, then (once the owner approves) the
# AppImage signed and a draft release made.
# Each action is pinned by its commit SHA (tests/test_pinned_inputs.py), as the repository requires
# (docs/GENESIS.md, step 5).
name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
defaults:
  run:
    shell: bash      # bash -eo pipefail: a script piped through tee fails the step when it fails
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tier 1 in three parts side by side, split by measured time (tests/parts.py), each measured by
  # coverage.py and timed test by test (docs/github-workflows.md, "Tier 1's parts", "Coverage")
  tier1:
    name: tier1 ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      APPKATA_PART: ${{ matrix.part }}/3
      APPKATA_COVERAGE: 1
      APPKATA_DURATIONS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true      # coworker/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: |
            build/appimage-cache
            build/pyside-*
          key: tier1-${{ hashFiles('packaging/versions.env') }}
      - run: COWORKER_UNATTENDED=1 coworker/bin/coworker status --no-network   # the coworker protocol (the coworker/ submodule): installed here, unattended
      - run: mkdir -p build && sh scripts/test-tier1.sh 2>&1 | tee build/ci-tier1.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-tier1.log test-tier1.sh
      # what the part measured, for the coverage job: a data file per process the tests started
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data-${{ matrix.part }}
          path: build/tier1/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # what each test took, for scripts/ci_times.py durations (the next split)
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: durations-${{ matrix.part }}
          path: build/tier1/durations.json
          if-no-files-found: ignore
          retention-days: 30

  # the parts' coverage together: totals by area against tests/coverage-floor.json, and the changed
  # lines no test reaches, as notices on them (scripts/coverage_report.py)
  coverage:
    needs: [tier1]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2        # the commit before: the changed lines count from it
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: build/appimage-cache
          key: coverage-${{ hashFiles('packaging/versions.env') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-data-*
          path: build/coverage-data
          merge-multiple: true
      - run: |
          echo "$(ls -A build/coverage-data | wc -l) data files"
          "$(sh scripts/python-standalone.sh)" scripts/coverage_report.py report --check --data build/coverage-data 2>&1 | tee build/ci-coverage.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-coverage.log coverage_report.py
      # the report as HTML and as data: totals.json is what scripts/coverage_report.py floor reads
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: ignore
          retention-days: 30

  # the Pages site (docs/github-workflows.md, "The Pages site"), on every run: the coverage report, the
  # history the published site holds with this commit's point added, the hardening page from the
  # repository's issues and the screenshots (this run's tour as master's, and each published release's
  # from its tag's run), kept as the `site` artifact; `pages` publishes master's
  site:
    needs: [coverage, tour]
    if: ${{ !github.event.repository.fork }}   # a fork's push builds no site: it would carry the fork's name
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read        # the releases, for their tours
      actions: read         # their tags' runs' tour artifacts
      issues: read          # the hardening page reads the issues
      pull-requests: read   # and the pull requests that close them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage
          path: build/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tour
          path: build/shots/master
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/coverage_site.py release-tours build/shots 2>&1 | tee build/ci-site.log
          python3 scripts/coverage_site.py build --screenshots build/shots 2>&1 | tee -a build/ci-site.log
          python3 scripts/public_text.py check build/site/*.html build/site/*.json build/site/screenshots/index.* 2>&1 | tee -a build/ci-site.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-site.log coverage_site.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: build/site/
          if-no-files-found: error
          retention-days: 30

  # the Linux tour (docs/github-workflows.md, "The tour"): the demo data (scripts/tour-data.sh: cached,
  # else synced with the job's token, else the snapshot in tests/data/demo), every screen with its
  # layout check (scripts/test-layout.sh), then the screenshot text check, and only then the screens as
  # the `tour` artifact, which `site` publishes for master. Run from ~/kata/AppKata, a link to the
  # checkout, so the paths the screens show read as on a development machine.
  tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true      # coworker/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: |
            build/appimage-cache
            build/pyside-*
          key: tour-${{ hashFiles('packaging/versions.env') }}
      # the demo data, on tags too: it isn't a release input, and a release's tour should show what
      # master's did. Its key follows demo_data.py; an older entry is made again from (remake).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/tour-data
          key: tour-data-${{ hashFiles('scripts/demo_data.py') }}
          restore-keys: tour-data-
      - run: mkdir -p ~/kata build && ln -sfn "$GITHUB_WORKSPACE" ~/kata/AppKata
      - run: cd ~/kata/AppKata && COWORKER_UNATTENDED=1 coworker/bin/coworker status --no-network   # the coworker protocol (the coworker/ submodule): installed here, unattended
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cd ~/kata/AppKata && sh scripts/tour-data.sh 2>&1 | tee build/ci-tour.log
      - run: cd ~/kata/AppKata && sh scripts/test-layout.sh 2>&1 | tee -a build/ci-tour.log
      - run: cd ~/kata/AppKata && sh scripts/test-screenshot-text.sh build/layout-tour/*/*.png 2>&1 | tee -a build/ci-tour.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-tour.log tour
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tour
          path: build/layout-tour/*/*.png
          if-no-files-found: error
          retention-days: 90     # a tag's, until its release is published and the site takes it
      # the same screens as one page for a review in the browser (scripts/tour_page.py): every screen
      # inlined, those that differ from master's published tour first, beside master's; uploaded
      # unzipped, so the run's artifact list opens it
      - run: |
          cd ~/kata/AppKata
          python3 scripts/tour_page.py build/layout-tour build/tour.html --title "AppKata's Linux tour at ${GITHUB_SHA::7}" \
              --summary build/tour-summary.md
          python3 scripts/public_text.py check build/tour.html build/tour-summary.md
      - id: page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: build/tour.html
          archive: false         # the artifact is the page itself, named tour.html
          if-no-files-found: error
          retention-days: 30
      # the run's summary, which the pull request's checks link to: what changed, and the page
      - env:
          PAGE: ${{ steps.page.outputs.artifact-url }}
        run: |
          cat ~/kata/AppKata/build/tour-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the tour](${PAGE}) (tour.html, every screen; changed ones beside master's)" >> "$GITHUB_STEP_SUMMARY"

  # tier 1's parts against their budget, and against each other (scripts/ci_times.py)
  ci-times:
    needs: [tier1]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_times.py "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true      # coworker/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: build/appimage-cache
          key: appimage-${{ hashFiles('packaging/versions.env') }}
      - run: COWORKER_UNATTENDED=1 coworker/bin/coworker status --no-network   # the coworker protocol (the coworker/ submodule): installed here, unattended
      - run: mkdir -p build && sh scripts/build-appimage.sh 2>&1 | tee build/ci-appimage.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-appimage.log build-appimage.sh
      - run: sed 's/^/::notice title=sha256::/' releases/AppKata-*-x86_64.AppImage.sha256      # what publish.sh shows before signing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: appimage
          path: releases/AppKata-*-x86_64.AppImage*
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true      # coworker/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: build/wine-cache
          key: windows-${{ hashFiles('packaging/versions.env', 'scripts/build-windows.sh', 'packaging/windows/icuuc-stub.c') }}
      - run: COWORKER_UNATTENDED=1 coworker/bin/coworker status --no-network   # the coworker protocol (the coworker/ submodule): installed here, unattended
      - run: mkdir -p build && sh scripts/build-windows.sh 2>&1 | tee build/ci-windows.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-windows.log build-windows.sh
      - run: sed 's/^/::notice title=sha256::/' releases/AppKata-*-setup.exe.sha256      # what publish.sh shows before signing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: releases/AppKata-*-setup.exe*
          if-no-files-found: error

  # the one check the master ruleset requires: it passes only when tier 1's parts, the coverage and
  # both builds did (ci-times reports beside it, and doesn't hold a merge)
  ci:
    needs: [tier1, coverage, appimage, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.tier1.result }} ${{ needs.coverage.result }} ${{ needs.appimage.result }} ${{ needs.windows.result }}
        run: |
          echo "tier1, coverage, appimage, windows: $RESULTS"
          test "$RESULTS" = "success success success success"

  # a push to master only, once `ci` passes: the site to the repository's GitHub Pages; the github-pages
  # environment takes deployments from master alone
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.repository.fork
    needs: [ci, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # a v* tag only: the tag must name the version the files carry
  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/appkata_core/__init__.py)
          echo "tag $GITHUB_REF_NAME, __version__ $v"
          test "$GITHUB_REF_NAME" = "v$v"

  # a v* tag only, once the owner approves (the release environment holds the key and asks): the
  # AppImage signed with the release key's signing subkey, in a job that checks out nothing and runs
  # nothing it downloads
  sign:
    if: github.ref_type == 'tag'
    needs: [ci, version]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: appimage
          path: out
      - working-directory: out
        env:
          SIGNING_KEY: ${{ secrets.APPKATA_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.APPKATA_SIGNING_PASSPHRASE }}
        run: |
          sha256sum -c AppKata-*-x86_64.AppImage.sha256
          f=$(echo AppKata-*-x86_64.AppImage)
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          printf '%s' "$SIGNING_PASSPHRASE" |
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
          gpg --batch --verify "$f.asc" "$f"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signature
          path: out/AppKata-*-x86_64.AppImage.asc
          if-no-files-found: error

  # a v* tag only: a draft release of the five release files, each by name, from the three artifacts
  # that hold them; the owner publishes it (scripts/publish.sh, whose verify wants exactly these five:
  # tests/test_workflows.py holds this job to it)
  release:
    if: github.ref_type == 'tag'
    needs: [sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # each by its name, never the whole run: the run also keeps the coverage report, the site and the
      # tour, and a download that names nothing takes them all
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: appimage
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signature
          path: out
      - working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l
          v=${GITHUB_REF_NAME#v}
          sha256sum -c "AppKata-$v-x86_64.AppImage.sha256" "AppKata-$v-setup.exe.sha256"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "AppKata $v" --generate-notes \
            "AppKata-$v-x86_64.AppImage" "AppKata-$v-x86_64.AppImage.sha256" "AppKata-$v-x86_64.AppImage.asc" \
            "AppKata-$v-setup.exe" "AppKata-$v-setup.exe.sha256"
