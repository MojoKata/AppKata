# AppKata's CI (docs/github-workflows.md). Every PR and push to master: tier 1 and both builds,
# whose files (unsigned, each with its .sha256) are kept with the run. A v* tag: the same, built
# without the caches, then the AppImage signed and a draft release made (added by the signing step).
# Each action is pinned by its commit SHA (tests/test_pinned_inputs.py).
name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: |
            build/appimage-cache
            build/pyside-*
          key: tier1-${{ hashFiles('packaging/versions.env') }}
      - run: sh scripts/test-tier1.sh

  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: build/appimage-cache
          key: appimage-${{ hashFiles('packaging/versions.env') }}
      - run: sh scripts/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: appimage
          path: releases/AppKata-*-x86_64.AppImage*
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: build/wine-cache
          key: windows-${{ hashFiles('packaging/versions.env', 'scripts/build-windows.sh', 'packaging/windows/icuuc-stub.c') }}
      - run: sh scripts/build-windows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: releases/AppKata-*-setup.exe*
          if-no-files-found: error

  # the one check the master ruleset requires: it passes only when every job above did
  ci:
    needs: [tier1, appimage, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.tier1.result }} ${{ needs.appimage.result }} ${{ needs.windows.result }}
        run: |
          echo "tier1, appimage, windows: $RESULTS"
          test "$RESULTS" = "success success success"
