">22</text><text x="70.0" y="513.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#9aa0b3" text-anchor="start">- </text><text x="85.0" y="513.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#eceef4" text-anchor="start">Sandbox network</text><text x="197.9" y="513.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#fbbf24" text-anchor="start"> (linux)</text><text x="258.1" y="513.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#9aa0b3" text-anchor="start">: </text><text x="273.1" y="513.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#86efac" text-anchor="start">yes</text><text x="38.0" y="534.0" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="400" fill="#686d80" text-anchor="end">23</text><text x="70.0" y="534.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#9aa0b3" text-anchor="start">- </text><text x="85.0" y="534.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#eceef4" text-anchor="start">Sandbox folders</text><text x="197.9" y="534.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#fbbf24" text-anchor="start"> (linux)</text><text x="258.1" y="534.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#9aa0b3" text-anchor="start">: </text><text x="273.1" y="534.0" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="400" fill="#86efac" text-anchor="start">+~/Pictures</text><path d="M626,228V312" stroke="#8089ff" stroke-width="2" opacity="0.6"/><rect x="640.0" y="224.0" width="612.0" height="62.0" rx="11" fill="#1f222b" stroke="#2c303c" stroke-width="1"/><text x="654.0" y="246.0" font-family="Cantarell" font-size="13" font-weight="700" fill="#eceef4" text-anchor="start">The review of the app as a whole</text><text x="654.0" y="265.0" font-family="Cantarell" font-size="11.5" font-weight="400" fill="#9aa0b3" text-anchor="start">Trust, Rating, Tags and install options, as before (10.3.1)</text><path d="M626,333V379" stroke="#8089ff" stroke-width="2" opacity="0.6"/><rect x="640.0" y="329.0" width="612.0" height="54.0" rx="11" fill="#1f222b" stroke="#2c303c" stroke-width="1"/><text x="654.0" y="351.0" font-family="Cantarell" font-size="13" font-weight="700" fill="#eceef4" text-anchor="start">A template + an override</text><text x="654.0" y="370.0" font-family="Cantarell" font-size="11.5" font-weight="400" fill="#9aa0b3" text-anchor="start">A built-in template by name, then just what differs (an extra folder). AppKata ships the templates; several Trusts →</text><text x="654.0" y="384.0" font-family="Cantarell" font-size="11.5" font-weight="400" fill="#9aa0b3" text-anchor="start">the strictest, and only what they all allow</text><path d="M626,396V459" stroke="#8089ff" stroke-width="2" opacity="0.6"/><rect x="640.0" y="392.0" width="612.0" height="62.0" rx="11" fill="#1f222b" stroke="#2c303c" stroke-width="1"/><text x="654.0" y="414.0" font-family="Cantarell" font-size="13" font-weight="700" fill="#eceef4" text-anchor="start">A review of 3.6.0</text><text x="654.0" y="433.0" font-family="Cantarell" font-size="11.5" font-weight="400" fill="#9aa0b3" text-anchor="start">Why this version needs more</text><path d="M626,480V543" stroke="#8089ff" stroke-width="2" opacity="0.6"/><rect x="640.0" y="476.0" width="612.0" height="62.0" rx="11" fill="#1f222b" stroke="#2c303c" stroke-width="1"/><text x="654.0" y="498.0" font-family="Cantarell" font-size="13" font-weight="700" fill="#eceef4" text-anchor="start">More access from 3.6.0 on</text><text x="654.0" y="517.0" font-family="Cantarell" font-size="11.5" font-weight="400" fill="#9aa0b3" text-anchor="start">A standing review badge; your grants are kept until you review</text><text x="70.0" y="561.0" font-family="Cantarell" font-size="12" font-weight="400" fill="#686d80" text-anchor="start">Suggestions only: what you choose for an app in AppKata always wins.</text></g><rect x="0.5" y="0.5" width="1279" height="799" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08"/></g></svg>