xt-anchor="middle">Add a source or a trust to fill your catalog</text><text x="380.0" y="428.0" font-family="Cantarell" font-size="13" font-weight="400" fill="#9aa0b3" text-anchor="start">A Source is an app you trust yourself: its git project. A Trust is a reviewer’s signed</text><text x="380.0" y="447.0" font-family="Cantarell" font-size="13" font-weight="400" fill="#9aa0b3" text-anchor="start">AppKata.md, which lists many apps.</text><rect x="525.0" y="480.0" width="114.8" height="34.0" rx="10" fill="#8089ff"/><g transform="translate(537.0 489.0) scale(1)" fill="none" stroke="#ffffff" color="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3V13M3 8H13"/></g><text x="559.0" y="501.7" font-family="Cantarell" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">Add source</text><rect x="649.8" y="480.0" width="105.2" height="34.0" rx="10" fill="#1f222b" stroke="#2c303c" stroke-width="1"/><g transform="translate(661.8 489.0) scale(1)" fill="none" stroke="#eceef4" color="#eceef4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8L13.5 4V8C13.5 11 11.2 13.3 8 14.3C4.8 13.3 2.5 11 2.5 8V4Z"/><path d="M5.5 8.2L7.3 10L10.6 6.4"/></g><text x="683.8" y="501.7" font-family="Cantarell" font-size="13" font-weight="700" fill="#eceef4" text-anchor="start">Add trust</text><rect width="1280" height="800" fill="#0b0d14" opacity="0.55"/><rect x="360.0" y="208.0" width="560.0" height="384.0" rx="20" fill="#1f222b" filter="url(#lift)"/><rect x="360.5" y="208.5" width="559.0" height="383.0" rx="20" fill="none" stroke="#2c303c" stroke-width="1"/><text x="390.0" y="264.0" font-family="Cantarell" font-size="20" font-weight="700" fill="#eceef4" text-anchor="start">Install AppKata?</text><circle cx="876" cy="258" r="14" fill="#2c303c"/><g transform="translate(870.0 252.0) scale(0.75)" fill="none" stroke="#9aa0b3" color="#9aa0b3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4L1